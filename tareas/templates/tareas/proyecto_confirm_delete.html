{% extends 'base.html' %}

{% block title %}Eliminar proyecto{% endblock %}

{% block content %}

<h1>Eliminar proyecto</h1>

<p>¿Seguro que deseas eliminar "{{ object.nombre }}"?</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">Sí, eliminar</button>
</form>

<a href="{% url 'proyecto_detail' object.pk %}">Cancelar</a>

{% endblock %}
