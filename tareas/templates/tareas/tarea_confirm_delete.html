{% extends 'base.html' %}

{% block title %}Eliminar tarea{% endblock %}

{% block content %}

<section class="card confirm-card">


<h1>Eliminar tarea</h1>

<p>
    ¿Estás seguro de que deseas eliminar la tarea
    <strong>"{{ object.titulo }}"</strong>?
</p>

<p class="muted">
    Esta acción no se puede deshacer.
</p>

<form method="post">

    {% csrf_token %}

    <div class="actions">

        <button
            type="submit"
            class="btn-danger"
        >
            Sí, eliminar tarea
        </button>

        <a
            class="btn-secondary"
            href="{% url 'proyecto_detail' object.proyecto.pk %}"
        >
            Cancelar
        </a>

    </div>

</form>


</section>

{% endblock %}
